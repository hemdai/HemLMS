volumes:
  hemlms_data:
networks:
  hemlms_network:
services:
  postgres:
    networks:
      - hemlms_network
    image: postgres
    volumes:
      - hemlms_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: on-failure

  api:
    networks:
      - hemlms_network
    restart: on-failure
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: hemlms-backend-build-stage
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/code
    command: uvicorn src.app.main:app --reload --host 0.0.0.0 --port 5000
    depends_on:
      - postgres

  frontend:
    networks:
      - hemlms_network
    restart: always
    build:
      context: ./lms_vue
      dockerfile: Dockerfile
      target: build-stage
    volumes:
      - './lms_vue:/app'
      - '/app/node_modules'
    ports:
      - "8080:8080"
    environment:
      - CHOKIDAR_USEPOLLING=true 
      - ./lms_vue:/app
    command: npm run serve
    depends_on:
      - api
